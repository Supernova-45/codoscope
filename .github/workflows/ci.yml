name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: python -m unittest discover -s backend -p "test_*.py"
      - run: python -m py_compile backend/*.py adapter/*.py

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
