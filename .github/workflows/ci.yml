name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements.txt
      - run: python -m unittest discover -s backend -p "test_*.py"
      - run: python -m py_compile backend/*.py adapter/*.py analysis/*.py

      - name: Validate fixture against shared schema
        run: |
          python - <<'PY'
          import json
          from jsonschema import validate
          schema = json.load(open("adapter/schema.json"))
          for path in ("data/atlas_fixture.json", "public/data/atlas_fixture.json"):
              validate(json.load(open(path)), schema)
          PY

      - run: docker build -f backend/Dockerfile -t codoscope-api:ci .

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
